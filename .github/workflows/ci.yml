name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration tests exercise an exclusion constraint, an advisory lock
    # and what happens when transactions collide. A stubbed database would only
    # prove the stub agrees with itself, so CI runs a real one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: khel
          POSTGRES_PASSWORD: khel
          POSTGRES_DB: khel_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race because the booking path's whole purpose is correctness under
      # concurrency; a data race in the test harness would mask a real one.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://khel:khel@localhost:5432/khel_arena_test?sslmode=disable
        run: go test ./... -count=1 -race -cover
